name: Module CI

on: [push, pull_request, workflow_dispatch]

permissions: {contents: read}

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then echo "$files"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/evidence
          go test -race -count=1 -json ./... > target/evidence/go-test.json
      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: Vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5
          govulncheck ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-mock-go-tests-${{ github.run_id }}
          path: target/evidence/go-test.json
          retention-days: 1
          if-no-files-found: error

  image:
    runs-on: ubuntu-24.04
    needs: go
    if: ${{ !cancelled() }}
    env:
      IMAGE: ouf-vertical-mock:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify image identity
        run: |
          mkdir -p target/evidence
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/GioNob/ouf-vertical-mock \
            -t "$IMAGE" .
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10008:10008"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
      - name: Exercise module release gate
        shell: bash
        run: bash scripts/ci/gate-smoke.sh "$IMAGE" 2>&1 | tee target/evidence/gate-smoke.log
      - name: Scan tested image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: target/evidence/trivy.json
      - name: Preserve tested image for governed delivery
        if: success() && needs.go.result == 'success' && github.event_name == 'pull_request'
        env:
          OUF_REVIEWED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          umask 077
          mkdir -p target/governed-image
          docker save "$IMAGE" | gzip -n > target/governed-image/image.tar.gz
          python3 scripts/ci/governed-image.py
          (cd target/governed-image && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: success() && needs.go.result == 'success' && github.event_name == 'pull_request'
        with:
          name: vertical-mock-governed-image-${{ github.run_id }}
          path: target/governed-image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: vertical-mock-go-tests-${{ github.run_id }}
          path: target/evidence
      - name: Checksum available evidence
        if: always()
        shell: bash
        run: |
          mkdir -p target/evidence
          cd target/evidence
          if [[ -f ../governed-image/SHA256SUMS ]]; then cp ../governed-image/SHA256SUMS image-SHA256SUMS; fi
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertical-mock-evidence-${{ github.run_id }}
          path: target/evidence/
          retention-days: 14
          if-no-files-found: error
